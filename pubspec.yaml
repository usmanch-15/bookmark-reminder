name: bookmark_reminder
description: Save items and get reminded later
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core / Backend
  supabase_flutter: ^2.5.6
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

  # Phase 2: Calendar, Export/Import
  table_calendar: ^3.1.2
  csv: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2

  # Phase 3: Offline sync, Home widget
  connectivity_plus: ^6.0.5
  home_widget: ^0.6.0

  # Production: env config + crash reporting
  flutter_dotenv: ^5.1.0
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"